# Собирает бинари на каждый тег vX.Y.Z и выкладывает их релизом: из него
# качают и install.sh, и сама утилита при claudestatus update.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Сборка
        run: |
          set -eu
          mkdir dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="claudestatus_${os}_${arch}"
            if [ "$os" = windows ]; then
              name="${name}.exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.versionOverride=${GITHUB_REF_NAME}" \
              -o "dist/${name}" ./claudestatus
          done
          cd dist && sha256sum * > checksums.txt

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
