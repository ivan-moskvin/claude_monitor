# The checks themselves, called from ci.yml (every pull request) and from
# release.yml (every tag). One definition: a release must pass exactly what a
# pull request passes, or the gate is only as good as whoever remembers to keep
# the two lists the same.
name: tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The status line and the update are shared between the systems, while the
    # per-user directories they write to are not: the tests run everywhere the
    # release is built for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The build the users actually get: no test binary is involved in it.
      - name: Build
        run: cargo build --release --locked
