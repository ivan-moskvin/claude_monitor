<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Claude Limit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="popup" id="popup">
      <h1 class="title">Claude Limit</h1>

      <section class="rings" id="rings" hidden>
        <svg viewBox="0 0 160 160" class="dial">
          <circle class="track" cx="80" cy="80" r="70" stroke-width="14" />
          <circle class="progress" id="outer-arc" cx="80" cy="80" r="70" stroke-width="14" />
          <circle class="track" cx="80" cy="80" r="52" stroke-width="10" id="inner-track" />
          <circle class="progress" id="inner-arc" cx="80" cy="80" r="52" stroke-width="10" />
        </svg>

        <div class="clock">
          <svg class="clock-icon" id="glyph-clock" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M8 4.3v4.1l2.6 1.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <svg class="clock-icon" id="glyph-reset" viewBox="0 0 16 16" aria-hidden="true" hidden>
            <path
              d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <path d="M12.4 1.6v3.2H9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="clock-value" id="clock-value">—</span>
          <span class="clock-caption" id="clock-caption">до сброса</span>
        </div>
      </section>

      <ul class="legend" id="legend"></ul>

      <p class="note" id="note" hidden></p>
      <p class="error" id="error" hidden></p>

      <hr class="rule" />

      <section class="settings">
        <label class="row toggle">
          <span>Запускать при входе</span>
          <input type="checkbox" id="autostart" />
        </label>

        <div class="row">
          <span id="statusline-label">Строка статуса</span>
          <button type="button" id="statusline-action" class="link">проверяю…</button>
        </div>
        <p class="hint" id="statusline-hint" hidden></p>
      </section>

      <hr class="rule" />

      <footer class="row">
        <button type="button" id="refresh" class="link">Обновить</button>
        <button type="button" id="quit" class="link">Выйти</button>
      </footer>
    </main>

    <script src="main.js"></script>
  </body>
</html>
